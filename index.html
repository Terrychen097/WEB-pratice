<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每月消费统计</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>每月消费统计</h1>
    <div class="month-nav">
      <button type="button" id="prevMonth" aria-label="上个月">‹</button>
      <input type="month" id="monthPicker">
      <button type="button" id="nextMonth" aria-label="下个月">›</button>
    </div>
  </header>

  <main>
    <section class="stats">
      <div class="stat"><span class="label">本月合计</span><span class="value" id="statTotal">¥0.00</span></div>
      <div class="stat"><span class="label">笔数</span><span class="value" id="statCount">0</span></div>
      <div class="stat"><span class="label">日均</span><span class="value" id="statDaily">¥0.00</span></div>
      <div class="stat"><span class="label">较上月</span><span class="value" id="statDelta">—</span></div>
    </section>

    <section class="card">
      <h2>分类细分</h2>
      <div class="breakdown">
        <svg id="donut" viewBox="0 0 120 120" role="img" aria-label="分类占比环形图"></svg>
        <table class="cat-table">
          <thead><tr><th>分类</th><th class="num">金额</th><th class="num">占比</th><th class="num">笔数</th><th class="num">较上月</th></tr></thead>
          <tbody id="catBody"></tbody>
        </table>
      </div>
      <p class="empty" id="emptyHint">这个月还没有消费记录。</p>
    </section>

    <section class="card">
      <h2>每日支出</h2>
      <div id="dailyChart" class="daily"></div>
    </section>

    <section class="card">
      <h2>记一笔</h2>
      <form id="form" class="form">
        <input type="date" id="fDate" required>
        <select id="fCat" required></select>
        <input type="number" id="fAmount" placeholder="金额" min="0.01" step="0.01" required>
        <input type="text" id="fNote" placeholder="备注（可选）" maxlength="60">
        <button type="submit">添加</button>
      </form>
    </section>

    <section class="card">
      <div class="list-head">
        <h2>本月明细</h2>
        <div class="tools">
          <select id="filterCat"><option value="">全部分类</option></select>
          <button type="button" id="exportBtn">导出 CSV</button>
          <label class="file-btn">导入 CSV<input type="file" id="importInput" accept=".csv,text/csv" hidden></label>
        </div>
      </div>
      <table class="list">
        <thead><tr><th>日期</th><th>分类</th><th>备注</th><th class="num">金额</th><th></th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
